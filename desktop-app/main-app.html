<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <title>Metrixa AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F5F5F3;
            color: #1A1A1A;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            height: 100vh;
            gap: 0;
        }

        /* Left Panel */
        .left-panel {
            background: #F5F5F3;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid #E5E5E5;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .logo-icon svg {
            width: 100%;
            height: 100%;
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 32px;
            color: #1A1A1A;
        }

        .permissions-list {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .perm-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #F0F0F0;
        }

        .perm-item:last-child {
            border-bottom: none;
        }

        .perm-name {
            font-weight: 600;
            font-size: 13px;
            color: #1A1A1A;
        }

        .perm-value {
            font-size: 13px;
            color: #22c55e;
            font-weight: 600;
        }

        /* Right Panel */
        .right-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #6EC1E4 0%, #E9A4D4 50%, #FFB7A3 100%);
            overflow: hidden;
        }

        .chat-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            padding: 20px 32px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: #1A1A1A;
        }

        .chat-messages {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-bubble {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .msg-bubble.ai {
            align-self: flex-start;
            background: white;
            color: #1A1A1A;
        }

        .msg-bubble.user {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.9);
            color: #1A1A1A;
        }

        .chat-input-area {
            padding: 24px 32px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        input {
            flex: 1;
            background: white;
            border: 1px solid #E5E5E5;
            border-radius: 20px;
            padding: 12px 20px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #C4F582;
        }

        .send-btn {
            background: #1A1A1A;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="left-panel">
            <div class="logo-container">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 32V8L20 20L32 8V32" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="square" />
                    </svg>
                </div>
                <h2 class="app-title">Metrixa AI</h2>
            </div>

            <div class="permissions-list">
                <div class="perm-item">
                    <span class="perm-name">Local AI Engine</span>
                    <span class="perm-value">Active</span>
                </div>
                <div class="perm-item">
                    <span class="perm-name">Privacy Protocol</span>
                    <span class="perm-value">Encrypted</span>
                </div>
                <div class="perm-item">
                    <span class="perm-name">Model Version</span>
                    <span class="perm-value">LLaVA 1.5</span>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="chat-container">
                <div class="chat-header">
                    <div class="header-title">Vision Chat</div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="msg-bubble ai">
                        Hi! I'm Metrixa. I'm observing your screen locally and ready to help. What can I do for you
                        today?
                    </div>
                </div>

                <div class="chat-input-area">
                    <div class="input-container">
                        <input type="text" id="chatInput" placeholder="Ask me about your screen...">
                        <button class="send-btn" id="sendBtn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ipc = window.api;
        const msgContainer = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(type, text) {
            console.log(`Adding ${type} message:`, text);
            const div = document.createElement('div');
            div.className = `msg-bubble ${type}`;

            // Format text: handle newlines and bolding
            const formattedText = String(text)
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            div.innerHTML = formattedText;
            msgContainer.appendChild(div);
            msgContainer.scrollTop = msgContainer.scrollHeight;
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage('user', text);
            chatInput.value = '';

            // Add loading
            const loading = document.createElement('div');
            loading.className = 'msg-bubble ai';
            loading.id = 'loading';
            loading.textContent = 'Analyzing...';
            msgContainer.appendChild(loading);

            ipc.send('manual-analysis', { query: text });
            console.log('ipc.send manual-analysis triggered');
        }

        ipc.on('analysis-result', (data) => {
            const loading = document.getElementById('loading');
            if (loading) loading.remove();
            addMessage('ai', data);
        });

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>

</html>
