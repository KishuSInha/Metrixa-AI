<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <title>Welcome to Metrixa AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F5F5F3;
            color: #1A1A1A;
            height: 100vh;
            overflow: hidden;
            display: flex;
            -webkit-app-region: drag;
            user-select: none;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            height: 100vh;
            gap: 0;
        }

        /* Left Panel - Welcome */
        .left-panel {
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #F5F5F3;
        }

        .ghost-icon {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .ghost-face {
            font-size: 40px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
            color: #1A1A1A;
        }

        .subtitle {
            color: #666;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 400px;
        }

        .button {
            background: #C4F582;
            color: #1A1A1A;
            border: none;
            padding: 14px 32px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-app-region: no-drag;
            display: inline-block;
            width: fit-content;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(196, 245, 130, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        /* Right Panel - Visual */
        .right-panel {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .visual-card {
            background: linear-gradient(135deg, #6EC1E4 0%, #E9A4D4 50%, #FFB7A3 100%);
            border-radius: 28px;
            width: 100%;
            max-width: 480px;
            height: 600px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 28px;
        }

        .task-bubble {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 24px 32px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            max-width: 400px;
            font-size: 15px;
            color: #1A1A1A;
            line-height: 1.5;
        }

        .page-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
        }

        /* Success Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            -webkit-app-region: no-drag;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 48px;
            text-align: center;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            -webkit-app-region: no-drag;
        }

        .success-checkmark {
            width: 72px;
            height: 72px;
            background: #22C55E;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: white;
            font-size: 36px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1A1A1A;
        }

        .modal-desc {
            color: #666;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .modal-button {
            background: #1A1A1A;
            color: white;
            border: none;
            padding: 16px 48px;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-app-region: no-drag;
        }

        .modal-button:hover {
            transform: scale(1.05);
            background: #000;
        }

        .modal-button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>
    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <div class="success-checkmark">✓</div>
            <h2 class="modal-title">You're all set!</h2>
            <p class="modal-desc">Authentication successful.<br>Metrixa AI is ready to help.</p>
            <button class="modal-button" id="launchBtn">Open Metrixa</button>
        </div>
    </div>

    <div class="container">
        <!-- Left Panel -->
        <div class="left-panel">
            <div class="ghost-icon">
                <div class="ghost-face">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <circle cx="12" cy="16" r="2.5" fill="#1A1A1A" />
                        <circle cx="28" cy="16" r="2.5" fill="#1A1A1A" />
                        <path d="M12 26 Q20 30 28 26" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"
                            fill="none" />
                    </svg>
                </div>
            </div>

            <h1>Hi, I'm Ghost!</h1>
            <p class="subtitle">
                I'm your AI assistant. I can handle lots of tasks for you across your applications. Let me free up your
                time.
            </p>
            <button class="button" id="startBtn">Sounds Good!</button>
        </div>

        <!-- Right Panel -->
        <div class="right-panel">
            <div class="visual-card">
                <img src="assets/bg1.png" alt="Background" class="bg-image">
                <div class="task-bubble">
                    Put together prep notes for each of my meetings tomorrow.
                </div>
                <div class="page-indicator">1/9</div>
            </div>
        </div>
    </div>

    <script>
        console.log('🚀 Onboarding loaded');

        const startBtn = document.getElementById('startBtn');
        const successModal = document.getElementById('successModal');
        const launchBtn = document.getElementById('launchBtn');

        // Show permissions setup (we'll transition to it)
        startBtn.addEventListener('click', () => {
            console.log('✓ Getting started');
            // For now, jump directly to success
            // In production, you'd show permission screens here
            setTimeout(() => {
                successModal.classList.add('active');
            }, 300);
        });

        // Launch main app
        launchBtn.addEventListener('click', async () => {
            console.log('🚀 Launching app');
            
            if (!window.api) {
                console.error('❌ window.api not available');
                alert('Connection error. Please restart.');
                return;
            }

            try {
                launchBtn.textContent = 'Launching...';
                launchBtn.disabled = true;
                window.api.send('complete-setup');
                console.log('✓ Launch signal sent');
            } catch (error) {
                console.error('❌ Launch error:', error);
                launchBtn.textContent = 'Open Metrixa';
                launchBtn.disabled = false;
            }
        });

        // Check API availability
        if (!window.api) {
            console.error('❌ window.api not found');
        } else {
            console.log('✓ window.api available');
        }
    </script>
</body>

</html>
