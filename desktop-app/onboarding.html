<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <title>Welcome to Metrixa AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FFFFFF;
            color: #1A1A1A;
            height: 100vh;
            overflow: hidden;
            display: flex;
            -webkit-app-region: drag;
            user-select: none;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            height: 100vh;
        }

        /* Left Panel */
        .left-panel {
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #FFFFFF;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .logo-icon svg {
            width: 100%;
            height: 100%;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
            color: #1A1A1A;
        }

        .subtitle {
            color: #666;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 400px;
        }

        .status-box {
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .status-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .status-label {
            font-weight: 600;
            color: #666;
        }

        .status-value {
            font-weight: 600;
            color: #1A1A1A;
        }

        .button {
            background: #74D4FB;
            color: #1A1A1A;
            border: none;
            padding: 14px 32px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-app-region: no-drag;
            display: inline-block;
            width: fit-content;
        }

        .button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(116, 212, 251, 0.4);
        }

        .button:disabled {
            background: #E5E5E5;
            color: #999;
            cursor: not-allowed;
        }

        .right-panel {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .visual-card {
            background: linear-gradient(135deg, #74D4FB 0%, #FFFFFF 100%);
            border-radius: 28px;
            width: 100%;
            max-width: 480px;
            height: 600px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 28px;
            opacity: 0.9;
        }

        .progress-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 20px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 80%;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .progress-bar {
            height: 6px;
            background: #F0F0F0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #74D4FB;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left-panel">
            <div class="logo-icon">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 32V8L20 20L32 8V32" stroke="#74D4FB" stroke-width="3.5" stroke-linecap="square" />
                </svg>
            </div>

            <h1>Hi, I'm Metrixa AI!</h1>
            <p class="subtitle">
                I'm your local-first AI assistant. I process everything on your machine for maximum privacy and zero
                latency.
            </p>

            <div class="status-box">
                <div class="status-line">
                    <span class="status-label">Local Engine:</span>
                    <span class="status-value" id="ollamaStatus">Checking...</span>
                </div>
                <div class="status-line">
                    <span class="status-label">Inference Model:</span>
                    <span class="status-value" id="modelStatus">Pending...</span>
                </div>
            </div>

            <button class="button" id="mainBtn" disabled>Checking System...</button>
        </div>

        <div class="right-panel">
            <div class="visual-card">
                <img src="assets/bg1.png" alt="Background" class="bg-image">

                <div class="progress-overlay" id="bootProgress" style="display: none;">
                    <div class="progress-text">
                        <span id="stepText">Initializing...</span>
                        <span id="percentText">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ipc;
        try {
            if (window.api) {
                ipc = window.api;
            } else {
                const { ipcRenderer } = require('electron');
                ipc = {
                    send: (channel, data) => ipcRenderer.send(channel, data),
                    on: (channel, func) => ipcRenderer.on(channel, (event, ...args) => func(...args))
                };
            }
        } catch (e) {
            console.error('IPC initialization failed:', e);
        }

        const mainBtn = document.getElementById('mainBtn');
        const ollamaStatusText = document.getElementById('ollamaStatus');
        const modelStatusText = document.getElementById('modelStatus');
        const bootProgress = document.getElementById('bootProgress');
        const progressFill = document.getElementById('progressFill');
        const stepText = document.getElementById('stepText');
        const percentText = document.getElementById('percentText');

        let systemState = 'startup';

        function init() {
            if (ipc) {
                console.log('Sending check-ollama...');
                ipc.send('check-ollama');
            } else {
                console.error('IPC not available');
                ollamaStatusText.textContent = 'Error: IPC Missing';
            }
        }

        ipc.on('ollama-status', (data) => {
            if (data.status === 'missing') {
                ollamaStatusText.textContent = 'Missing';
                ollamaStatusText.style.color = '#ef4444';
                mainBtn.disabled = false;
                mainBtn.textContent = 'Install AI Engine';
                systemState = 'install_required';
            }
            else if (data.status === 'ready') {
                ollamaStatusText.textContent = 'Installed';
                ollamaStatusText.style.color = '#74D4FB';
                
                // Always show Get Started if Ollama is available
                // Models will be pulled on demand
                modelStatusText.textContent = data.models && data.models.length > 0 ? 'Ready' : 'Models Available';
                modelStatusText.style.color = '#74D4FB';
                mainBtn.disabled = false;
                mainBtn.textContent = 'Get Started';
                systemState = 'ready';
            }
            else if (data.status === 'installed') {
                init();
            }
        });

        ipc.on('download-progress', (data) => {
            bootProgress.style.display = 'block';
            stepText.textContent = data.step;
            const match = data.detail.match(/(\d+)%/);
            if (match) {
                progressFill.style.width = match[1] + '%';
                percentText.textContent = match[1] + '%';
            }
        });

        mainBtn.addEventListener('click', () => {
            if (systemState === 'install_required') {
                ipc.send('install-ollama');
                mainBtn.disabled = true;
                mainBtn.textContent = 'Installing...';
            } else if (systemState === 'pull_required') {
                ipc.send('pull-model');
                mainBtn.disabled = true;
                mainBtn.textContent = 'Downloading...';
            } else if (systemState === 'ready') {
                ipc.send('complete-setup');
            }
        });

        init();
    </script>
</body>

</html>
