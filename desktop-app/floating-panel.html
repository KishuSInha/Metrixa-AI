<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrixa AI - New Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 16px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background: #ffffff;
            color: #111111;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        /* Header - Ghost Style */
        .header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            -webkit-app-region: drag;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* macOS Traffic Lights */
        .traffic-lights {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
            margin-right: 4px;
        }

        .light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            border: 0.5px solid rgba(0, 0, 0, 0.1);
        }

        .light.close { background: #ff5f57; }
        .light.minimize { background: #febc2e; }
        .light.expand { background: #28c840; }

        .header-text {
            font-size: 14px;
            font-weight: 500;
            color: #666;
            margin-left: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            -webkit-app-region: no-drag;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: #F4F4F4;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: #111;
            cursor: pointer;
        }

        .model-selector svg {
            width: 14px;
            height: 14px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Messages Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            gap: 0;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #e5e5e5;
            border-radius: 3px;
        }

        /* Welcome State */
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding: 80px 0;
            max-width: 640px;
            margin: 0 auto;
            width: 100%;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 600;
            color: #111;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* Message Styles */
        .message {
            display: flex;
            flex-direction: column;
            padding: 24px 0;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user .message-bubble {
            font-size: 24px;
            font-weight: 500;
            color: #111;
            max-width: 100%;
            line-height: 1.3;
        }

        .message.ai .message-bubble {
            font-size: 16px;
            color: #444;
            max-width: 100%;
            line-height: 1.7;
        }

        /* Agent Status */
        .agent-status {
            padding: 8px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #74D4FB;
            margin-top: 12px;
        }

        .status-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(116, 212, 251, 0.2);
            border-top-color: #74D4FB;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Input Area - Capsule Design */
        .input-area {
            padding: 0 40px 40px;
            flex-shrink: 0;
        }

        .input-outer-wrapper {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 28px;
            padding: 8px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }

        .input-outer-wrapper:focus-within {
            border-color: #111;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .input-inner-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #taskInput {
            width: 100%;
            min-height: 48px;
            max-height: 200px;
            padding: 12px 14px;
            background: transparent;
            border: none;
            color: #111;
            font-size: 17px;
            font-family: inherit;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .input-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
        }

        .input-actions-left {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            padding: 8px;
            background: transparent;
            border: none;
            color: #999;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #F4F4F4;
            color: #111;
        }

        .action-btn svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.25;
        }

        .send-btn {
            padding: 8px 16px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            background: #333;
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .send-btn.stop {
            background: #ff5f57;
        }

        /* Context Indicator */
        .context-indicator {
            padding: 2px 8px;
            font-size: 11px;
            color: #999;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .context-indicator::before {
            content: '';
            width: 5px;
            height: 5px;
            background: #28c840;
            border-radius: 50%;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <div class="traffic-lights">
                    <div class="light close" id="closeBtn"></div>
                    <div class="light minimize" id="minimizeBtn"></div>
                    <div class="light expand"></div>
                </div>
                <span class="header-text">New chat</span>
            </div>
            <div class="header-right">
                <div class="model-selector">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7L12 12L22 7L12 2Z"/><path d="M2 17L12 22L22 17"/><path d="M2 12L12 17L22 12"/></svg>
                    <span>Claude Opus 4.6</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="messages-container" id="messagesContainer">
                <div class="welcome-container" id="welcomeContainer">
                    <h1 class="welcome-title">Hey! How's it going? What can I help you with tonight?</h1>
                    <p class="welcome-subtitle">I'm your Metrixa intelligence layer. Ask me to analyze your screen, summarize complex documents, or automate a cross-app workflow.</p>
                </div>
            </div>
        </main>

        <div class="input-area">
            <div class="input-outer-wrapper">
                <div class="input-inner-wrapper">
                    <textarea id="taskInput" placeholder="Ask me anything..." rows="1"></textarea>
                    
                    <div class="input-controls">
                        <div class="input-actions-left">
                            <button class="action-btn" title="Add attachment">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                            </button>
                            <button class="action-btn" title="Voice input">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                            </button>
                            <div class="context-indicator" id="contextIndicator">
                                <span id="contextAppName">Floating</span>
                            </div>
                        </div>
                        
                        <button class="send-btn" id="sendBtn" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="floating-panel.js"></script>
</body>
</html>
